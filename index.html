<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>왕실족발 간판 시안</title>
<meta name="description" content="경주왕실족발 불국점 간판 시안 — 눌러서 완성 간판 보기">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Batang:wght@400;700&family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
  :root{
    --bg:#efe9dd; --card:#f7f2e8; --ink:#241f1a; --muted:#6f665b; --line:#ddd4c3; --accent:#8f1d22;
    --shadow:0 10px 30px rgba(40,32,22,.16);
    --kr:"Noto Sans KR",system-ui,sans-serif; --disp:"Jua","Noto Sans KR",system-ui,sans-serif;
    --subfont:"Jua","Noto Sans KR",sans-serif;
    --ratio:3.4;
    --s1-chh:25;--s1-chx:-1;--s1-chy:0;--s1-wmh:50;--s1-wmx:1;--s1-wmy:0;--s1-inf:12;--s1-infx:0;--s1-infy:25;--s1-pad:2;
    --s2-chh:34;--s2-chx:-1;--s2-chy:9;--s2-wmh:53;--s2-wmx:-3;--s2-wmy:4;--s2-bandh:19;--s2-bandf:11;
    --s3-wmh:56;--s3-wmx:0;--s3-wmy:0;--s3-chh:26;--s3-chx:3;--s3-chy:5;--s3-rightw:20;--s3-inf:12.5;
    --s4-chh:24;--s4-chx:-2;--s4-chy:0;--s4-wmh:44;--s4-wmx:0;--s4-wmy:0;--s4-inf:9;--s4-infx:2;--s4-infy:0;--s4-bd:0.9;--s4-inset:4.5;
  }
  :root.f-jua{--subfont:"Jua","Noto Sans KR",sans-serif}
  :root.f-do{--subfont:"Do Hyeon","Noto Sans KR",sans-serif}
  :root.f-ba{--subfont:"Gowun Batang",serif}
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--kr);line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%}
  .wrap{max-width:680px;margin:0 auto;padding:16px 16px calc(28px + env(safe-area-inset-bottom,0px))}
  .head{text-align:center;margin-bottom:12px}
  .head .eb{font-weight:700;color:var(--accent);font-size:.8rem;letter-spacing:.04em}
  .head h1{font-family:var(--disp);font-weight:400;font-size:1.5rem;margin:2px 0 0}

  .row{margin:0 0 9px}
  .row .lb{font-size:.74rem;font-weight:700;color:var(--muted);letter-spacing:.03em;margin:0 2px 5px}
  .btns{display:grid;gap:7px}
  .btns.c4{grid-template-columns:repeat(4,1fr)}
  .btns.c3{grid-template-columns:repeat(3,1fr)}
  .btns.c2{grid-template-columns:repeat(2,1fr)}
  .btns button{font-family:var(--kr);font-weight:700;font-size:.9rem;cursor:pointer;border:2px solid var(--line);
    background:var(--card);color:var(--ink);padding:11px 4px;border-radius:11px;line-height:1.15}
  .btns button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .btns button:active{transform:scale(.97)}
  #g-panel button span{display:block;font-size:.62rem;font-weight:700;opacity:.78;margin-top:2px}

  .stagewrap{margin:14px 0 0}
  .stage .sign{display:none}
  .stage .sign.on{display:block}
  .stage .s2.on{display:flex;flex-direction:column}
  .stage .s3.on{display:flex}
  .tapnote{text-align:center;color:var(--muted);font-size:.82rem;margin:9px 0 0}

  .copy{margin-top:16px;display:flex;flex-direction:column;gap:8px}
  .copy button{font-family:var(--kr);font-weight:800;font-size:1rem;cursor:pointer;border:none;background:var(--accent);color:#fff;padding:14px;border-radius:12px}
  .copy button:active{transform:scale(.98)}
  .copy .done{display:none;text-align:center;color:var(--accent);font-weight:700;font-size:.9rem}
  .copy .done.on{display:block}
  .copy textarea{width:100%;min-height:52px;font-family:ui-monospace,monospace;font-size:.78rem;border:1px solid var(--line);border-radius:10px;padding:9px;background:var(--card);color:var(--ink);resize:vertical}
  .guide{text-align:center;color:var(--muted);font-size:.85rem;margin-top:12px}

  /* 회전 전체화면 */
  #full{position:fixed;inset:0;background:rgba(22,18,14,.94);z-index:999;display:none;align-items:center;justify-content:center;overflow:hidden}
  #full.on{display:flex}
  #full .sign{flex:none;width:90vh;height:calc(90vh / var(--ratio));transform:rotate(90deg);border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
  #full .closehint{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-size:.85rem;opacity:.85}

  /* ===== 간판 ===== */
  .sign{width:100%;aspect-ratio:var(--ratio);border-radius:8px;overflow:hidden;container-type:size;position:relative;box-shadow:var(--shadow);border:1px solid rgba(0,0,0,.16);cursor:pointer}
  .sign::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:3;background:radial-gradient(120% 95% at 50% 42%,rgba(255,255,255,.10),transparent 72%)}
  .ch,.wm{display:block;flex:0 0 auto;width:auto;height:auto;max-width:100%;object-fit:contain}
  .subtext{font-family:var(--subfont)}
  .branch{line-height:1;border-radius:2.2cqh;display:inline-block;font-weight:400;font-synthesis:none;white-space:nowrap}
  .tel{line-height:1;letter-spacing:.01em;font-weight:400;font-synthesis:none;white-space:nowrap}
  .tel[hidden]{display:none}

  .s1{background:#f6f0e2}
  .s1 .ch{position:absolute;top:50%;left:calc(var(--s1-pad)*1cqw);width:calc(var(--s1-chh)*1cqw);height:auto;max-height:92cqh;transform:translateY(-50%) translate(calc(var(--s1-chx)*1cqw),calc(var(--s1-chy)*1cqh))}
  .s1 .col{position:absolute;top:50%;left:50%;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%) translate(calc(var(--s1-wmx)*1cqw),calc(var(--s1-wmy)*1cqh))}
  .s1 .wm{width:calc(var(--s1-wmh)*1cqw);height:auto;max-width:none;max-height:92cqh}
  .s1 .info{position:absolute;top:50%;right:calc(var(--s1-pad)*1cqw);display:flex;flex-direction:column;align-items:flex-end;gap:3cqh;text-align:right;transform:translateY(-50%) translate(calc(var(--s1-infx)*1cqw),calc(var(--s1-infy)*1cqh))}
  .s1 .branch{font-size:calc(var(--s1-inf)*1cqh);padding:2cqh 3.2cqw;background:#8f1d22;color:#f6f0e2}
  .s1 .tel{font-size:calc(var(--s1-inf)*1cqh);color:#8f1d22}

  .s2{background:#ffffff}
  .s2 .top2{flex:1;display:flex;align-items:center;justify-content:center;gap:3.5cqw;padding:4cqh 5cqw;position:relative;z-index:1}
  .s2 .ch{width:calc(var(--s2-chh)*1cqw);height:auto;max-height:88cqh;transform:translate(calc(var(--s2-chx)*1cqw),calc(var(--s2-chy)*1cqh))}
  .s2 .wm{max-height:calc(var(--s2-wmh)*1cqh);max-width:58cqw;transform:translate(calc(var(--s2-wmx)*1cqw),calc(var(--s2-wmy)*1cqh))}
  .s2 .band{height:calc(var(--s2-bandh)*1cqh);background:#8f1d22;display:flex;align-items:center;justify-content:center;gap:2.5cqw;padding:0 3cqw;position:relative;z-index:2}
  .s2 .band b{color:#fff;font-size:calc(var(--s2-bandf)*1cqh);line-height:1;font-weight:400;font-synthesis:none;white-space:nowrap}
  .s2 .band .dot{opacity:.9}

  .s3{background:#f6f0e2}
  .s3 .left{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 4cqw}
  .s3 .wm{max-height:calc(var(--s3-wmh)*1cqh);max-width:100%;transform:translate(calc(var(--s3-wmx)*1cqw),calc(var(--s3-wmy)*1cqh))}
  .s3 .right{flex:0 0 calc(var(--s3-rightw)*1%);background:#8f1d22;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2.5cqh;padding:3cqh 2.5cqw}
  .s3 .ch{width:calc(var(--s3-chh)*1cqw);height:auto;max-height:82cqh;max-width:94%;position:relative;z-index:1;transform:translate(calc(var(--s3-chx)*1cqw),calc(var(--s3-chy)*1cqh))}
  .s3 .branch{font-size:calc(var(--s3-inf)*1cqh);padding:1.8cqh 3cqw;background:#f7e0b0;color:#8f1d22;position:relative;z-index:2}
  .s3 .tel{font-size:calc(var(--s3-inf)*1cqh);color:#fff;position:relative;z-index:2}

  .s4{background:#8f1d22}
  .s4::after{content:"";position:absolute;inset:calc(var(--s4-inset)*1cqh) 2.2cqw;z-index:1;border:calc(var(--s4-bd)*1cqh) solid rgba(255,255,255,.85);border-radius:3px;pointer-events:none}
  .s4 .ch,.s4 .col,.s4 .info{z-index:2}
  .s4 .ch{position:absolute;top:50%;left:6cqw;width:calc(var(--s4-chh)*1cqw);height:auto;max-height:88cqh;transform:translateY(-50%) translate(calc(var(--s4-chx)*1cqw),calc(var(--s4-chy)*1cqh))}
  .s4 .col{position:absolute;top:50%;left:50%;display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-50%) translate(calc(var(--s4-wmx)*1cqw),calc(var(--s4-wmy)*1cqh))}
  .s4 .wm{width:calc(var(--s4-wmh)*1cqw);height:auto;max-width:none;max-height:88cqh;filter:brightness(0) invert(1)}
  .s4 .info{position:absolute;top:50%;right:6cqw;display:flex;flex-direction:column;align-items:flex-end;gap:3cqh;text-align:right;transform:translateY(-50%) translate(calc(var(--s4-infx)*1cqw),calc(var(--s4-infy)*1cqh))}
  .s4 .branch{font-size:calc(var(--s4-inf)*1cqh);padding:2cqh 3.2cqw;background:#f7e0b0;color:#8f1d22}
  .s4 .tel{font-size:calc(var(--s4-inf)*1cqh);color:#fff}
</style>

<div class="wrap">
  <div class="head">
    <div class="eb">경주왕실족발 · 불국점</div>
    <h1>간판 시안</h1>
  </div>

  <div class="row"><div class="lb">1. 캐릭터</div><div class="btns c4" id="g-char">
    <button data-v="color" aria-pressed="true">컬러 돼지</button><button data-v="crown">왕관 돼지</button><button data-v="head">얼굴</button><button data-v="seal">도장</button></div></div>
  <div class="row"><div class="lb">2. 상호명 글씨체</div><div class="btns c4" id="g-wm">
    <button data-v="1" aria-pressed="true">둥근1</button><button data-v="2">붓2</button><button data-v="2r">붓빨강</button><button data-v="3">둥근3</button></div></div>
  <div class="row"><div class="lb">3. 보조 글씨체</div><div class="btns c3" id="g-font">
    <button data-v="jua" aria-pressed="true">둥근</button><button data-v="do">굵은</button><button data-v="ba">명조</button></div></div>
  <div class="row"><div class="lb">4. 전화번호</div><div class="btns c2" id="g-tel">
    <button data-v="on" aria-pressed="true">넣기</button><button data-v="off">빼기</button></div></div>
  <div class="row"><div class="lb">5. 배치</div><div class="btns c4" id="g-panel">
    <button data-v="0" aria-pressed="true">1번<span>왼쪽 캐릭터</span></button><button data-v="1">2번<span>하단 띠</span></button><button data-v="2">3번<span>좌우 분할</span></button><button data-v="3">4번<span>프레임</span></button></div></div>

  <div class="stagewrap">
    <div class="stage" id="stage">
      <div class="sign s1 on"><img class="ch" alt="캐릭터"><div class="col"><img class="wm" alt="왕실족발"></div>
        <div class="info"><span class="branch subtext">불국점</span><span class="tel subtext">T 010-5282-3222</span></div></div>
      <div class="sign s2"><div class="top2"><img class="ch" alt="캐릭터"><img class="wm" alt="왕실족발"></div>
        <div class="band"><b class="subtext">경주왕실족발 불국점</b><b class="dot subtext tel">·</b><b class="subtext tel">T 010-5282-3222</b></div></div>
      <div class="sign s3"><div class="left"><img class="wm" alt="왕실족발"></div>
        <div class="right"><img class="ch" alt="캐릭터"><span class="branch subtext">불국점</span><span class="tel subtext">T 010-5282-3222</span></div></div>
      <div class="sign s4"><img class="ch" alt="캐릭터"><div class="col"><img class="wm" alt="왕실족발"></div>
        <div class="info"><span class="branch subtext">불국점</span><span class="tel subtext">T 010-5282-3222</span></div></div>
    </div>
    <div class="tapnote">패널을 한 번 누르면 크게(회전) · 다시 누르면 닫기</div>
  </div>

  <div class="copy">
    <button id="btnCopy">설정 복사하기</button>
    <div class="done" id="done">복사됐어요! 채팅에 붙여넣어 보내주세요</div>
    <textarea id="out" readonly aria-label="선택 내용"></textarea>
  </div>
  <div class="guide">마음에 드는 조합을 위 <b>설정 복사하기</b>로 복사해 보내주세요</div>
</div>

  var root=document.documentElement, signs=document.querySelectorAll(".stage .sign");
